<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Full Collection • Elizabeth Aven Photography</title>
    <meta name="description" content="Explore couples, families, senior and professional portraits by Elizabeth Aven Photography in Navasota, Texas." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --cream: #fff;
        --cream-deep: #fff;
        --taupe: #a8896c;
        --oak: #2c2522;
        --ember: #c17f59;
        --sage: #8b9a7d;
        --ink-soft: #5c5148;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "Outfit", system-ui, sans-serif;
        background: #fff;
        color: var(--oak);
        line-height: 1.65;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      h1,
      h2,
      h3,
      .serif {
        font-family: "Cinzel", Georgia, serif;
        font-weight: 700;
        line-height: 1.05;
        letter-spacing: -0.02em;
      }

      /* =====================     <nav class="nav">
      <div class="nav-content">
        <a href="index.html" class="logo">
          <span class="brand-art nav-mark"><img src="assets/images/branding/logo.png" alt="Elizabeth Aven Photography" width="2000" height="2000" /></span>
        </a>
        <ul class="nav-links" id="nav-links">
          <li><a href="index.html#about">About</a></li>
          <li><a href="index.html#memory">Portfolio</a></li>
          <li><a href="index.html#pricing">Packages</a></li>
          <li><a href="index.html#contact">Inquire</a></li>
        </ul>
        <button class="hamburger" id="hamburger" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>

 ===================== */
      .nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: #fff;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid rgba(44, 37, 34, 0.08);
        z-index: 100;
        padding: 0.7rem 1.25rem;
      }

      .nav-content {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
      }

      /* transparent PNG — no disc, no shadow */

      .logo-text {
        font-family: "Cinzel", Georgia, serif;
        font-size: 1.2rem;
        letter-spacing: 1px;
        color: var(--oak);
      }

      .nav-links {
        display: flex;
        gap: 2.25rem;
        list-style: none;
      }

      .nav-links a {
        color: var(--oak);
        text-decoration: none;
        font-size: 0.95rem;
        transition: color 0.2s ease;
      }

      .nav-links a:hover {
        color: var(--ember);
      }

      .hamburger {
        display: none;
        flex-direction: column;
        gap: 5px;
        background: none;
        border: none;
        cursor: pointer;
        padding: 10px;
      }

      .hamburger span {
        display: block;
        width: 26px;
        height: 2px;
        background: var(--oak);
        border-radius: 2px;
        transition:
          transform 0.3s ease,
          opacity 0.3s ease;
      }
      .hamburger.open span:nth-child(1) {
        transform: translateY(7px) rotate(45deg);
      }
      .hamburger.open span:nth-child(2) {
        opacity: 0;
      }
      .hamburger.open span:nth-child(3) {
        transform: translateY(-7px) rotate(-45deg);
      }

      .section {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 1.5rem;
      }

      /* ===================== ABOUT ===================== */
      .about {
        padding: 6.5rem 0;
      }

      .about-panel {
        max-width: 1200px;
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.62);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: 32px;
        box-shadow: 0 30px 70px -35px rgb(0 0 0 / 0.18);
        padding: 3.5rem 2rem;
      }

      .about-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 3rem;
        align-items: center;
      }

      @media (min-width: 900px) {
        .about-panel {
          padding: 4rem 4rem;
        }
        .about-grid {
          grid-template-columns: 1fr 1.05fr;
          gap: 5rem;
        }
      }

      .about-text .label {
        font-size: 0.82rem;
        letter-spacing: 3.5px;
        text-transform: uppercase;
        color: var(--taupe);
        margin-bottom: 1rem;
        display: block;
      }

      .about-text h2 {
        font-size: clamp(2.4rem, 5.2vw, 3.6rem);
        margin-bottom: 1.5rem;
      }

      .about-text p {
        font-size: 1.05rem;
        color: var(--ink-soft);
        margin-bottom: 1.3rem;
      }

      .about-text .about-signoff {
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--oak);
        margin-top: 0.15rem;
      }

      .portrait-frame {
        position: relative;
        max-width: 460px;
        margin: 0 auto;
        width: 100%;
      }

      .portrait-frame img {
        width: 100%;
        height: auto;
        display: block;
      }

      /* ===================== MEMORY COLLECTION ===================== */
      .memory {
        padding: 5.5rem 0;
      }

      .section-eyebrow {
        font-size: 0.82rem;
        letter-spacing: 3.5px;
        text-transform: uppercase;
        color: var(--taupe);
        margin-bottom: 0.8rem;
        display: block;
      }

      .memory-header {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        margin-bottom: 1.6rem;
      }

      .memory-header h2 {
        font-size: clamp(2.4rem, 5vw, 3.6rem);
        margin-bottom: 0.45rem;
      }

      .memory-intro {
        max-width: 590px;
        color: var(--ink-soft);
        font-size: 1.02rem;
      }

      .collection-shell {
        background: transparent;
        border: 0;
        box-shadow: none;
        padding: clamp(1rem, 2vw, 1.5rem);
        overflow: hidden;
      }

      .collection-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1rem;
      }

      .collection-tabs {
        display: flex;
        gap: 0.45rem;
        flex-wrap: wrap;
      }

      .collection-tab {
        font: inherit;
        cursor: pointer;
        padding: 9px 14px;
        border-radius: 999px;
        background: #fff;
        color: var(--ink-soft);
        border: 1px solid rgba(168, 137, 108, 0.18);
        transition:
          background 0.2s ease,
          color 0.2s ease,
          transform 0.2s ease;
      }
      .collection-tab:hover {
        transform: translateY(-1px);
      }
      .collection-tab.active {
        background: var(--oak);
        color: #fff;
      }


      .featured-gallery {
        display: grid;
        grid-template-columns: minmax(0, 1.45fr) minmax(220px, 0.72fr);
        gap: 0.9rem;
        min-height: 560px;
      }

      .gallery-side {
        display: grid;
        grid-template-rows: 1fr 1fr;
        gap: 0.9rem;
        min-height: 0;
      }

      .gallery-card {
        position: relative;
        width: 100%;
        min-height: 0;
        overflow: hidden;
        border: 0;
        padding: 0;
        border-radius: 22px;
        background: #d8cbbb;
        cursor: pointer;
        box-shadow: 0 18px 40px -24px rgb(0 0 0 / 0.32);
        isolation: isolate;
      }

      .gallery-card img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .gallery-card::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, transparent 52%, rgba(25, 20, 17, 0.68) 100%);
        z-index: 1;
        pointer-events: none;
      }

      .gallery-card-main {
        min-height: 560px;
      }
      .gallery-card-small {
        min-height: 0;
      }

      .gallery-caption {
        position: absolute;
        z-index: 2;
        left: 1.15rem;
        right: 1.15rem;
        bottom: 1rem;
        color: #fff;
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 1rem;
        text-align: left;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.28);
      }
      .gallery-caption strong {
        font-size: 1rem;
        font-weight: 500;
      }
      .gallery-caption span {
        font-size: 0.78rem;
        opacity: 0.78;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .collection-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem 0.2rem 0.1rem;
        color: var(--ink-soft);
        font-size: 0.92rem;
      }

      .open-gallery {
        padding: 11px 18px;
        border-radius: 999px;
        background: transparent;
        color: var(--oak);
        border: 1px solid rgba(44, 37, 34, 0.18);
        transition:
          background 0.2s ease,
          color 0.2s ease;
      }
      .open-gallery:hover {
        background: var(--oak);
        color: #fff;
      }

      @media (max-width: 760px) {
        .collection-toolbar {
          align-items: flex-start;
        }
          .featured-gallery {
          grid-template-columns: 1fr;
          min-height: 0;
        }
        .gallery-card-main {
          min-height: 470px;
        }
        .gallery-side {
          grid-template-columns: 1fr 1fr;
          grid-template-rows: none;
          min-height: 210px;
        }
        .gallery-card-small {
          min-height: 210px;
        }
        .gallery-caption {
          left: 0.9rem;
          right: 0.9rem;
          bottom: 0.8rem;
        }
        .gallery-card-small .gallery-caption strong {
          font-size: 0.88rem;
        }
        .gallery-card-small .gallery-caption span {
          display: none;
        }
        .collection-footer {
          align-items: flex-start;
          flex-direction: column;
        }
        .open-gallery {
          width: 100%;
        }
      }

      @media (max-width: 480px) {
        .gallery-card-main {
          min-height: 410px;
        }
        .gallery-side {
          min-height: 170px;
        }
        .gallery-card-small {
          min-height: 170px;
        }
      }

      /* ===================== PRICING ===================== */
      .pricing {
        padding: 5.5rem 0;
      }

      .pricing-panel {
        max-width: 1200px;
        margin: 0 auto;
        background: transparent;
        border: 0;
        box-shadow: none;
        padding: 3.5rem 1.5rem;
      }
      @media (min-width: 900px) {
        .pricing-panel {
          padding: 4.5rem 3.5rem;
        }
      }

      .pricing-header {
        text-align: center;
        max-width: 640px;
        margin: 0 auto 3rem;
      }
      .pricing-header h2 {
        font-size: clamp(2.4rem, 5vw, 3.6rem);
        margin-bottom: 0.6rem;
      }
      .pricing-header p {
        color: var(--ink-soft);
        margin-top: 0.8rem;
      }

      .category {
        margin-bottom: 3rem;
      }
      .category:last-child {
        margin-bottom: 0;
      }

      .category-header {
        font-family: "Cinzel", Georgia, serif;
        font-size: 1.3rem;
        color: var(--ember);
        margin-bottom: 1.1rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid rgba(168, 137, 108, 0.3);
      }

      .vibe-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.4rem;
      }
      @media (min-width: 680px) {
        .vibe-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (min-width: 1100px) {
        .vibe-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      .vibe-card {
        background: #fff;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 10px 30px -15px rgb(0 0 0 / 0.1);
        transition:
          transform 0.3s cubic-bezier(0.23, 1, 0.32, 1),
          box-shadow 0.3s ease;
        border: 1px solid #ede4d8;
        display: flex;
        flex-direction: column;
      }
      .vibe-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 22px 45px -12px rgb(0 0 0 / 0.15);
      }
      .vibe-card.selected {
        border-color: var(--ember);
        box-shadow: 0 0 0 4px rgba(193, 127, 89, 0.12);
      }

      .vibe-card-header {
        padding: 1.5rem 1.8rem 1rem;
      }
      .vibe-card-header h3 {
        font-size: 1.45rem;
        color: var(--oak);
        margin-bottom: 0.3rem;
      }

      .price {
        font-size: 2rem;
        font-weight: 700;
        color: var(--ember);
      }
      .price span {
        font-size: 0.95rem;
        font-weight: 400;
        color: #8b7f72;
      }

      .vibe-details {
        padding: 0 1.8rem 1.5rem;
        flex: 1;
      }
      .vibe-details ul {
        list-style: none;
        font-size: 0.95rem;
        color: var(--ink-soft);
      }
      .vibe-details li {
        padding: 5px 0;
        display: flex;
        gap: 9px;
      }
      .vibe-details li::before {
        content: "•";
        color: var(--taupe);
        font-size: 1.3rem;
        line-height: 1;
      }

      .choose-btn {
        margin: 0 1.8rem 1.8rem;
        width: calc(100% - 3.6rem);
        padding: 14px 24px;
        background: var(--oak);
        color: #fff;
        border: none;
        border-radius: 9999px;
        font-size: 0.95rem;
        font-weight: 500;
        letter-spacing: 0.6px;
        cursor: pointer;
        transition:
          background 0.2s ease,
          transform 0.2s ease;
      }
      .choose-btn:hover {
        background: var(--ember);
        transform: translateY(-2px);
      }

      /* ===================== CONTACT ===================== */
      .contact {
        padding: 5.5rem 0 6.5rem;
      }

      .contact-card {
        max-width: 640px;
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-radius: 26px;
        padding: 3rem 1.6rem;
        box-shadow: 0 25px 60px -20px rgb(0 0 0 / 0.14);
      }
      @media (min-width: 600px) {
        .contact-card {
          padding: 3.2rem 2.6rem;
        }
      }

      .contact-card h2 {
        font-size: clamp(2rem, 5vw, 2.45rem);
        text-align: center;
        margin-bottom: 0.5rem;
      }
      .contact-card > p {
        text-align: center;
        color: #8b7f72;
        margin-bottom: 2.2rem;
      }

      .name-row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0;
      }
      @media (min-width: 480px) {
        .name-row {
          grid-template-columns: 1fr 1fr;
          gap: 1.3rem;
        }
      }

      .form-group {
        margin-bottom: 1.4rem;
      }
      .form-group label {
        display: block;
        font-size: 0.9rem;
        margin-bottom: 0.45rem;
        color: var(--ink-soft);
      }
      .form-group input,
      .form-group textarea {
        width: 100%;
        padding: 14px 0;
        background: transparent;
        border: none;
        border-bottom: 2px solid #ede4d8;
        font-size: 1.02rem;
        font-family: "Outfit", sans-serif;
        color: var(--oak);
        transition: border-color 0.2s ease;
      }
      .form-group input:focus,
      .form-group textarea:focus {
        outline: none;
        border-bottom-color: var(--ember);
      }
      .form-group textarea {
        min-height: 120px;
        resize: vertical;
      }

      .submit-btn {
        width: 100%;
        padding: 18px;
        background: var(--oak);
        color: #fff;
        border: none;
        border-radius: 9999px;
        font-size: 1rem;
        font-weight: 500;
        letter-spacing: 1.2px;
        margin-top: 1rem;
        cursor: pointer;
        transition: background 0.2s ease;
      }
      .submit-btn:hover {
        background: var(--ember);
      }

      /* ===================== FOOTER ===================== */
      .footer {
        background: #fff;
        color: var(--ink-soft);
        border-top: 1px solid #eee;
        padding: 3.6rem 0 2.6rem;
        z-index: 1;
      }
      .footer-content {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
        text-align: center;
      }
      @media (min-width: 720px) {
        .footer-content {
          flex-direction: row;
          justify-content: space-between;
          text-align: left;
        }
      }
      .footer-logo {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .footer-logo-text {
        font-family: "Cinzel", Georgia, serif;
        font-size: 1.4rem;
        color: #fff;
      }
      .footer-links {
        display: flex;
        gap: 2rem;
      }
      .footer-links a {
        color: var(--ink-soft);
        text-decoration: none;
        font-size: 0.92rem;
        transition: color 0.2s;
      }
      .footer-links a:hover {
        color: var(--oak);
      }

      <div class="nav-content">
        <a href="index.html" class="logo">
          <span class="brand-art nav-mark"><img src="assets/images/branding/logo.png" alt="Elizabeth Aven Photography" width="2000" height="2000" /></span>
        </a>
        <ul class="nav-links" id="nav-links">

        </ul>
        <button class="hamburger" id="hamburger" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>

 ===================== */
      @media (max-width: 899px) {











        .about {
          padding: 3.6rem 0 4.5rem;
        }

        .about-panel {
          padding: 2.15rem 1.35rem;
          border-radius: 26px;
        }

        .about-grid {
          grid-template-columns: minmax(0, 1fr) 132px;
          gap: 0.9rem 1rem;
          align-items: start;
        }

        .about-text {
          display: contents;
        }

        .about-text .label {
          grid-column: 1 / -1;
          grid-row: 1;
          margin-bottom: 0.25rem;
        }

        .about-text h2 {
          grid-column: 1;
          grid-row: 2;
          font-size: clamp(1.8rem, 7.8vw, 2.45rem);
          line-height: 1.04;
          margin-bottom: 0.4rem;
        }

        .portrait-frame {
          grid-column: 2;
          grid-row: 2 / span 2;
          width: 100%;
          max-width: 132px;
          align-self: center;
          margin: 0;
        }

        .about-text p {
          font-size: 0.94rem;
          line-height: 1.55;
          margin-bottom: 0.85rem;
        }

        .about-text p:first-of-type {
          grid-column: 1;
          grid-row: 3;
        }

        .about-text p:nth-of-type(n + 2) {
          grid-column: 1 / -1;
        }

        .about-text p:last-of-type {
          margin-bottom: 0;
        }
      }

      @media (max-width: 899px) {
        .memory {
          padding-left: 0.7rem;
          padding-right: 0.7rem;
        }
      }

      @media (max-width: 520px) {








        .about-panel {
          padding: 1.9rem 1.15rem;
        }

        .about-grid {
          grid-template-columns: minmax(0, 1fr) 112px;
          gap: 0.75rem 0.85rem;
        }

        .portrait-frame {
          max-width: 112px;
        }

        .about-text h2 {
          font-size: clamp(1.65rem, 7.5vw, 2.05rem);
        }

        .about-text p {
          font-size: 0.88rem;
        }
      }

      @media (max-width: 768px) {
        .nav-links {
          display: none;
          position: absolute;
          top: 100%;
          left: 0;
          right: 0;
          background: #fff;
          backdrop-filter: blur(14px);
          -webkit-backdrop-filter: blur(14px);
          flex-direction: column;
          gap: 0;
          padding: 0.5rem 1.5rem 1.5rem;
          border-bottom: 1px solid rgba(44, 37, 34, 0.1);
        }
        .nav-links.active {
          display: flex;
        }
        .nav-links li {
          border-top: 1px solid rgba(44, 37, 34, 0.06);
        }
        .nav-links a {
          display: block;
          padding: 0.95rem 0;
        }
        .hamburger {
          display: flex;
        }
      }

      .brand-art { position: relative; display: block; aspect-ratio: 1450 / 940; overflow: hidden; background: #fff; }
      .brand-art img { position: absolute; width: 137.931%; height: auto; max-width: none; left: -20.69%; top: -59.575%; display: block; }
      .nav-mark { width: 132px; }
      .footer-mark { width: 220px; }
      .hero { padding-top: 132px; padding-bottom: 64px; }
      .hero-grid { display: grid; grid-template-columns: 1.05fr 1fr; align-items: center; gap: clamp(2rem, 5vw, 5rem); }
      .hero-mark { width: 100%; margin: 0; }
      .hero-image { display: block; }
      .hero-image img { display: block; width: 100%; height: auto; max-height: 690px; object-fit: contain; }
      .open-gallery { display: inline-block; text-decoration: none; text-align: center; }
      .gallery-card { text-decoration: none; }
      .portrait-frame a { display: block; }
      section[id] { scroll-margin-top: 115px; }
